name: Build APK and PlayStore AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore for Play Store
        run: |
          keytool -genkey -v -keystore app/release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass hypershare123 -keypass hypershare123 \
            -dname "CN=HyperShare, OU=Mobile, O=ProShare, L=Agra, S=UP, C=IN"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK, Release APK and Play Store AAB
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Phone Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: 1-Phone-Testing-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: 2-PlayStore-Upload-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signing Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: 3-PlayStore-Keystore-Save-This
          path: app/release-key.jks
