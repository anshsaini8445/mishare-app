name: Build Air Rapid Share APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Deploy True InShare Architecture & Force 15MB Size
        run: |
          # Clean old files to prevent caching
          rm -rf app/src/main/res/layout/*
          rm -rf app/src/main/java/*
          rm -rf app/src/main/assets/*

          mkdir -p app/src/main/java/com/ansh/rapidshare
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/core

          # 1. Generate 11MB Uncompressible Random Payload (Guarantees 15MB+ APK)
          python3 -c '
          import os
          with open("app/src/main/assets/core/engine_data.bin", "wb") as f:
              f.write(os.urandom(11 * 1024 * 1024))
          '

          # 2. Build Configurations
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirRapidShare"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ansh.rapidshare'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ansh.rapidshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "4.0.0"
              }

              aaptOptions {
                  noCompress 'bin', 'dat'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          # 3. Colors & Theme (True InShare Blue & White)
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="inshare_primary">#0078FF</color>
              <color name="inshare_send_green">#00C853</color>
              <color name="inshare_receive_blue">#0091EA</color>
              <color name="bg_canvas">#F4F7FC</color>
              <color name="white">#FFFFFF</color>
              <color name="text_main">#1E293B</color>
              <color name="text_sub">#64748B</color>
              <color name="divider_line">#E2E8F0</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AirRapidShare" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0078FF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Air Rapid Share</string>
          </resources>
          EOF

          # 4. Circular Button Vectors
          cat << 'EOF' > app/src/main/res/drawable/circle_send.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#00C853"/>
              <size android:width="110dp" android:height="110dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circle_receive.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#0078FF"/>
              <size android:width="110dp" android:height="110dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_rapid_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0078FF" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00C853" android:pathData="M54,16 A38,38 0 0,1 92,54 A38,38 0 0,1 54,92 A38,38 0 0,1 16,54 A38,38 0 0,1 54,16 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M38,46 L54,30 L70,46 M54,30 L54,76 M38,66 L70,66"/>
          </vector>
          EOF

          # 5. Manifest with Android 11+ Package Visibility Queries
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Critical queries tag: Allows reading installed apps on Android 11-15 -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                  </intent>
              </queries>

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_rapid_logo"
                  android:roundIcon="@drawable/ic_rapid_logo"
                  android:label="Air Rapid Share"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AirRapidShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".SendActivity" android:exported="false" />
                  <activity android:name=".ReceiveActivity" android:exported="false" />
                  <activity android:name=".WebShareActivity" android:exported="false" />

                  <service
                      android:name=".TransferService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <activity
                      android:name="com.journeyapps.barcodescanner.CaptureActivity"
                      android:screenOrientation="portrait"
                      android:stateNotNeeded="true"
                      tools:replace="android:screenOrientation" />
              </application>
          </manifest>
          EOF

          # 6. InShare Main Dashboard (Blue Header, Dual Circle Action Buttons)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F4F7FC"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- True InShare Blue Header -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#0078FF"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:id="@+id/btnMenu"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:clickable="true"
                              android:focusable="true"
                              android:padding="6dp"
                              android:text="MENU"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="14dp"
                              android:layout_weight="1"
                              android:text="Air Rapid Share"
                              android:textColor="#FFFFFF"
                              android:textSize="21sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/btnPcShare"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:background="#1565C0"
                              android:clickable="true"
                              android:focusable="true"
                              android:paddingStart="12dp"
                              android:paddingTop="6dp"
                              android:paddingEnd="12dp"
                              android:paddingBottom="6dp"
                              android:text="PC Web"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- InShare Giant Dual Circle Buttons -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="24dp"
                          android:layout_marginBottom="16dp"
                          android:gravity="center"
                          android:orientation="horizontal">

                          <LinearLayout
                              android:id="@+id/cardSend"
                              android:layout_width="114dp"
                              android:layout_height="114dp"
                              android:layout_marginEnd="20dp"
                              android:background="@drawable/circle_send"
                              android:clickable="true"
                              android:elevation="6dp"
                              android:focusable="true"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="SEND"
                                  android:textColor="#FFFFFF"
                                  android:textSize="20sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Fast Mode"
                                  android:textColor="#E0FFFFFF"
                                  android:textSize="10sp" />
                          </LinearLayout>

                          <LinearLayout
                              android:id="@+id/cardReceive"
                              android:layout_width="114dp"
                              android:layout_height="114dp"
                              android:layout_marginStart="20dp"
                              android:background="@drawable/circle_receive"
                              android:clickable="true"
                              android:elevation="6dp"
                              android:focusable="true"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="RECEIVE"
                                  android:textColor="#FFFFFF"
                                  android:textSize="19sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="QR Ready"
                                  android:textColor="#E0FFFFFF"
                                  android:textSize="10sp" />
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Storage Info Card -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:layout_marginTop="-16dp"
                      android:layout_marginEnd="16dp"
                      app:cardBackgroundColor="#FFFFFF"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="4dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:padding="16dp">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Internal Storage"
                                  android:textColor="#1E293B"
                                  android:textSize="14sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvStorageSub"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp"
                                  android:text="Scanning space..."
                                  android:textColor="#64748B"
                                  android:textSize="12sp" />
                          </LinearLayout>

                          <TextView
                              android:id="@+id/btnStorageDetails"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:background="#F1F5F9"
                              android:clickable="true"
                              android:focusable="true"
                              android:paddingStart="12dp"
                              android:paddingTop="6dp"
                              android:paddingEnd="12dp"
                              android:paddingBottom="6dp"
                              android:text="Details"
                              android:textColor="#0078FF"
                              android:textSize="12sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Quick Categories Label -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="20dp"
                      android:layout_marginTop="22dp"
                      android:text="File Categories"
                      android:textColor="#1E293B"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <!-- Category Selection Row -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:paddingStart="14dp"
                      android:paddingEnd="14dp"
                      android:weightSum="4">

                      <LinearLayout
                          android:id="@+id/catApps"
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="APPS" android:textColor="#0078FF" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catVideos"
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VIDEOS" android:textColor="#00C853" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catPhotos"
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PHOTOS" android:textColor="#F59E0B" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catSongs"
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="MUSIC" android:textColor="#EC4899" android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          EOF

          # 7. Exact InShare Send Screen with Tab Switching
          cat << 'EOF' > app/src/main/res/layout/activity_send.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F8FAFC"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#FFFFFF"
                  android:elevation="2dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/btnBack"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:padding="6dp"
                      android:text="Back"
                      android:textColor="#1E293B"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvSendTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="12dp"
                      android:layout_weight="1"
                      android:text="Select Files"
                      android:textColor="#1E293B"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- InShare Category Selector Tabs -->
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:background="#FFFFFF"
                  android:scrollbars="none">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="match_parent"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp">

                      <TextView
                          android:id="@+id/tabApps"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Apps"
                          android:textColor="#0078FF"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tabVideos"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Videos"
                          android:textColor="#64748B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabPhotos"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Photos"
                          android:textColor="#64748B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabSongs"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Music"
                          android:textColor="#64748B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabFiles"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Files"
                          android:textColor="#64748B"
                          android:textSize="14sp" />
                  </LinearLayout>
              </HorizontalScrollView>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/tvSectionHeader"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Installed Packages"
                      android:textColor="#1E293B"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvItems"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:padding="6dp" />

              <!-- Bottom Send Floating Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:background="#FFFFFF"
                  android:elevation="8dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/tvSelectedCount"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="0 Selected"
                      android:textColor="#64748B"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNext"
                      android:layout_width="140dp"
                      android:layout_height="44dp"
                      android:backgroundTint="#00C853"
                      android:text="SEND"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          # 8. Grid Item Layout
          cat << 'EOF' > app/src/main/res/layout/item_share.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="6dp">

              <RelativeLayout
                  android:layout_width="64dp"
                  android:layout_height="64dp">

                  <ImageView
                      android:id="@+id/ivIcon"
                      android:layout_width="54dp"
                      android:layout_height="54dp"
                      android:layout_centerInParent="true" />

                  <CheckBox
                      android:id="@+id/cbSelect"
                      android:layout_width="wrap_content"
