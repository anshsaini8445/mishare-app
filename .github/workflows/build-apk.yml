name: Build Air Rapid Share APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Generate All Project Files
        run: |
          mkdir -p app/src/main/java/com/ansh/rapidshare
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirRapidShare"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ansh.rapidshare'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ansh.rapidshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_rapid_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00D59B"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,44a10,10 0,1 0,0 -20a10,10 0,0 0,0 20zM74,34a10,10 0,1 0,0 -20a10,10 0,0 0,0 20zM74,94a10,10 0,1 0,0 -20a10,10 0,0 0,0 20z"/>
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="6"
                  android:pathData="M42,38 L66,28 M42,50 L66,80"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#070D18</color>
              <color name="card_dark">#0E1726</color>
              <color name="card_border">#1A273E</color>
              <color name="accent_green">#00D59B</color>
              <color name="accent_blue">#0084FF</color>
              <color name="text_white">#F8FAFC</color>
              <color name="text_muted">#8B9BB4</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AirRapidShare" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Air Rapid Share</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_rapid_logo"
                  android:roundIcon="@drawable/ic_rapid_logo"
                  android:label="Air Rapid Share"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AirRapidShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".SendActivity" android:exported="false" />
                  <activity android:name=".ReceiveActivity" android:exported="false" />
                  <activity android:name=".WebShareActivity" android:exported="false" />

                  <service
                      android:name=".TransferService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <activity
                      android:name="com.journeyapps.barcodescanner.CaptureActivity"
                      android:screenOrientation="portrait"
                      android:stateNotNeeded="true"
                      tools:replace="android:screenOrientation" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnMenu"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:padding="6dp"
                          android:text="MENU"
                          android:textColor="@color/text_white"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="12dp"
                          android:layout_weight="1"
                          android:text="Air Rapid Share"
                          android:textColor="@color/accent_green"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:background="@color/card_dark"
                          android:paddingStart="10dp"
                          android:paddingTop="5dp"
                          android:paddingEnd="10dp"
                          android:paddingBottom="5dp"
                          android:text="5GHZ TURBO"
                          android:textColor="@color/accent_green"
                          android:textSize="11sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      app:cardBackgroundColor="@color/card_dark"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:padding="16dp">

                          <TextView
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:background="#16253C"
                              android:gravity="center"
                              android:text="FAST"
                              android:textColor="@color/accent_green"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="12dp"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Ultra-Fast 100 MB/s Engine"
                                  android:textColor="@color/text_white"
                                  android:textSize="15sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp"
                                  android:text="Direct Wi-Fi Socket Engine - Zero Data"
                                  android:textColor="@color/text_muted"
                                  android:textSize="11sp" />
                          </LinearLayout>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:background="#16253C"
                              android:paddingStart="8dp"
                              android:paddingTop="4dp"
                              android:paddingEnd="8dp"
                              android:paddingBottom="4dp"
                              android:text="5GHz"
                              android:textColor="@color/accent_green"
                              android:textSize="10sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="22dp"
                      android:orientation="horizontal">

                      <androidx.cardview.widget.CardView
                          android:id="@+id/cardSend"
                          android:layout_width="0dp"
                          android:layout_height="135dp"
                          android:layout_marginEnd="8dp"
                          android:layout_weight="1"
                          android:clickable="true"
                          android:focusable="true"
                          app:cardBackgroundColor="#00996F"
                          app:cardCornerRadius="24dp"
                          app:cardElevation="6dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="SEND"
                                  android:textColor="#FFFFFF"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Share apps and files"
                                  android:textColor="#E0FFFFFF"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <androidx.cardview.widget.CardView
                          android:id="@+id/cardReceive"
                          android:layout_width="0dp"
                          android:layout_height="135dp"
                          android:layout_marginStart="8dp"
                          android:layout_weight="1"
                          android:clickable="true"
                          android:focusable="true"
                          app:cardBackgroundColor="#005EC4"
                          app:cardCornerRadius="24dp"
                          app:cardElevation="6dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="RECEIVE"
                                  android:textColor="#FFFFFF"
                                  android:textSize="20sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Scan QR or Hotspot"
                                  android:textColor="#E0FFFFFF"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:orientation="horizontal">

                      <androidx.cardview.widget.CardView
                          android:id="@+id/cardHistory"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginEnd="6dp"
                          android:layout_weight="1"
                          app:cardBackgroundColor="@color/card_dark"
                          app:cardCornerRadius="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="History"
                                  android:textColor="@color/text_white"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0 records"
                                  android:textColor="@color/text_muted"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>

                      <androidx.cardview.widget.CardView
                          android:id="@+id/cardWebShare"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="6dp"
                          android:layout_weight="1"
                          app:cardBackgroundColor="@color/card_dark"
                          app:cardCornerRadius="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="14dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Connect to PC"
                                  android:textColor="@color/text_white"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Web Browser Share"
                                  android:textColor="@color/text_muted"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
                  </LinearLayout>

                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      app:cardBackgroundColor="@color/card_dark"
                      app:cardCornerRadius="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:padding="12dp"
                          android:weightSum="6">

                          <TextView
                              android:id="@+id/catApps"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Apps"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/catFiles"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Files"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/catVideos"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Videos"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/catPhotos"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Photos"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/catSongs"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Songs"
                              android:textColor="@color/text_muted"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/catContacts"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="center"
                              android:text="Contacts"
                              android:textColor="@color/text_muted"
                              android:textSize="11sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_send.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F8F9FA"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#FFFFFF"
                  android:elevation="2dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/btnBack"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Back"
                      android:textColor="#212529"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:layout_weight="1"
                      android:text="Send Files"
                      android:textColor="#212529"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <EditText
                      android:id="@+id/etSearch"
                      android:layout_width="140dp"
                      android:layout_height="36dp"
                      android:background="#E9ECEF"
                      android:hint="Search"
                      android:paddingStart="12dp"
                      android:paddingEnd="12dp"
                      android:textSize="13sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/tvSectionHeader"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Installed Apps"
                      android:textColor="#212529"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <CheckBox
                      android:id="@+id/cbSelectAll"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Select All"
                      android:textSize="12sp" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvItems"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:padding="8dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:background="#FFFFFF"
                  android:elevation="8dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/tvSelectedCount"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="0 SELECTED"
                      android:textColor="#ADB5BD"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNext"
                      android:layout_width="140dp"
                      android:layout_height="44dp"
                      android:backgroundTint="#00D59B"
                      android:text="NEXT"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_share.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="8dp">

              <RelativeLayout
                  android:layout_width="64dp"
                  android:layout_height="64dp">

                  <ImageView
                      android:id="@+id/ivIcon"
                      android:layout_width="54dp"
                      android:layout_height="54dp"
                      android:layout_centerInParent="true" />

                  <CheckBox
                      android:id="@+id/cbSelect"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:layout_alignParentBottom="true"
                      android:buttonTint="#00D59B"
                      android:clickable="false"
                      android:focusable="false" />
              </RelativeLayout>

              <TextView
                  android:id="@+id/tvName"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:maxLines="1"
                  android:textColor="#212529"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvSize"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:textColor="#6C757D"
                  android:textSize="10sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_receive.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0084FF"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/btnBackReceive"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
