name: Build Mi Share APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Repair and Setup Project Structure
        run: |
          # 1. अगर src रूट में बन गया हो तो उसे app/src में लाएं
          if [ -d "src" ] && [ ! -d "app/src" ]; then
            mkdir -p app
            mv src app/src
          fi

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/ansh/mishare

          # 2. settings.gradle को ठीक करें
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiShare"
          include ':app'
          EOF

          # 3. रूट build.gradle को ठीक करें
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 4. app/build.gradle तैयार करें (यही फ़ाइल मिसिंग थी)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ansh.mishare'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ansh.mishare"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "2.4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. सही themes.xml सुनिश्चित करें
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MiShare" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
              </style>
          </resources>
          EOF

          # 6. सही colors.xml सुनिश्चित करें
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#060B14</color>
              <color name="card_dark">#0F172A</color>
              <color name="accent_green">#00E599</color>
              <color name="accent_blue">#0084FF</color>
              <color name="text_white">#F8FAFC</color>
              <color name="text_muted">#94A3B8</color>
          </resources>
          EOF

          # 7. AndroidManifest.xml अगर रूट में हो तो कॉपी करें
          if [ ! -f app/src/main/AndroidManifest.xml ] && [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MiShare-v2.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
