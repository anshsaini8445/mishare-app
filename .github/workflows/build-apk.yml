name: Build Air Rapid Share APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Generate Complete InShare Architecture
        run: |
          mkdir -p app/src/main/java/com/ansh/rapidshare
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/webengine

          # 1. Commercial 11MB Asset Injection (Ensures APK reaches 15MB+ size)
          python3 -c '
          with open("app/src/main/assets/webengine/inshare_core.dat", "wb") as f:
              f.write(b"\x00" * (11 * 1024 * 1024))
          '

          # 2. Root Build Configurations
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirRapidShare"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. App Level Gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ansh.rapidshare'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ansh.rapidshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          # 4. InShare Colors, Styles & Vector Logo
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="inshare_blue">#0084FF</color>
              <color name="inshare_green">#00D59B</color>
              <color name="bg_light">#F5F7FB</color>
              <color name="card_bg">#FFFFFF</color>
              <color name="text_primary">#1C2536</color>
              <color name="text_secondary">#7A889B</color>
              <color name="divider_color">#E5E9F2</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AirRapidShare" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0084FF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Air Rapid Share</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_rapid_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0084FF"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#00D59B"
                  android:pathData="M54,14 A40,40 0 0,1 94,54 A40,40 0 0,1 54,94 A40,40 0 0,1 14,54 A40,40 0 0,1 54,14 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,44 L54,28 L70,44 M54,28 L54,78 M38,68 L70,68"/>
          </vector>
          EOF

          # 5. AndroidManifest with Full System Permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_rapid_logo"
                  android:roundIcon="@drawable/ic_rapid_logo"
                  android:label="Air Rapid Share"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AirRapidShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".SendActivity" android:exported="false" />
                  <activity android:name=".ReceiveActivity" android:exported="false" />
                  <activity android:name=".WebShareActivity" android:exported="false" />

                  <service
                      android:name=".TransferService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <activity
                      android:name="com.journeyapps.barcodescanner.CaptureActivity"
                      android:screenOrientation="portrait"
                      android:stateNotNeeded="true"
                      tools:replace="android:screenOrientation" />
              </application>
          </manifest>
          EOF

          # 6. Main Dashboard Layout (Exact InShare Header & Big Circles)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F5F7FB"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="220dp"
                      android:background="#0084FF"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:id="@+id/btnMenu"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="MENU"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="14dp"
                              android:layout_weight="1"
                              android:text="Air Rapid Share"
                              android:textColor="#FFFFFF"
                              android:textSize="20sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:background="#1665D8"
                              android:paddingStart="10dp"
                              android:paddingTop="4dp"
                              android:paddingEnd="10dp"
                              android:paddingBottom="4dp"
                              android:text="Wi-Fi 6 6GHz"
                              android:textColor="#00D59B"
                              android:textSize="11sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:orientation="horizontal">

                          <LinearLayout
                              android:id="@+id/cardSend"
                              android:layout_width="120dp"
                              android:layout_height="120dp"
                              android:layout_marginEnd="24dp"
                              android:background="@drawable/ic_rapid_logo"
                              android:clickable="true"
                              android:focusable="true"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="SEND"
                                  android:textColor="#FFFFFF"
                                  android:textSize="22sp"
                                  android:textStyle="bold" />
                          </LinearLayout>

                          <LinearLayout
                              android:id="@+id/cardReceive"
                              android:layout_width="120dp"
                              android:layout_height="120dp"
                              android:layout_marginStart="24dp"
                              android:background="@drawable/ic_rapid_logo"
                              android:clickable="true"
                              android:focusable="true"
                              android:gravity="center"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="RECEIVE"
                                  android:textColor="#FFFFFF"
                                  android:textSize="20sp"
                                  android:textStyle="bold" />
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>

                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:layout_marginTop="-24dp"
                      android:layout_marginEnd="16dp"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="6dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:padding="16dp">

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:id="@+id/tvStorageTitle"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Internal Storage"
                                  android:textColor="#1C2536"
                                  android:textSize="14sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/tvStorageSub"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp"
                                  android:text="Calculating storage..."
                                  android:textColor="#7A889B"
                                  android:textSize="12sp" />
                          </LinearLayout>

                          <Button
                              android:id="@+id/cardWebShare"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:backgroundTint="#0084FF"
                              android:text="Connect to PC"
                              android:textColor="#FFFFFF"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="20dp"
                      android:layout_marginTop="24dp"
                      android:text="Categories"
                      android:textColor="#1C2536"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:weightSum="4">

                      <LinearLayout
                          android:id="@+id/catApps"
                          android:layout_width="0dp"
                          android:layout_height="90dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="APPS" android:textColor="#0084FF" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catVideos"
                          android:layout_width="0dp"
                          android:layout_height="90dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VIDEOS" android:textColor="#00D59B" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catPhotos"
                          android:layout_width="0dp"
                          android:layout_height="90dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PHOTOS" android:textColor="#FF9800" android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/catSongs"
                          android:layout_width="0dp"
                          android:layout_height="90dp"
                          android:layout_margin="4dp"
                          android:layout_weight="1"
                          android:background="#FFFFFF"
                          android:gravity="center"
                          android:orientation="vertical">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="MUSIC" android:textColor="#E91E63" android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          EOF

          # 7. Send Screen Layout (Categories Tabs, Grid, Bottom Bar)
          cat << 'EOF' > app/src/main/res/layout/activity_send.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F8F9FA"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#FFFFFF"
                  android:elevation="2dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/btnBack"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Back"
                      android:textColor="#1C2536"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:layout_weight="1"
                      android:text="Send"
                      android:textColor="#1C2536"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <EditText
                      android:id="@+id/etSearch"
                      android:layout_width="140dp"
                      android:layout_height="36dp"
                      android:background="#E5E9F2"
                      android:hint="Search"
                      android:paddingStart="12dp"
                      android:paddingEnd="12dp"
                      android:textSize="13sp" />
              </LinearLayout>

              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:background="#FFFFFF"
                  android:scrollbars="none">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="match_parent"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:paddingStart="12dp"
                      android:paddingEnd="12dp">

                      <TextView
                          android:id="@+id/tabApps"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Apps"
                          android:textColor="#00D59B"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tabFiles"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Files"
                          android:textColor="#7A889B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabVideos"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Videos"
                          android:textColor="#7A889B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabPhotos"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Photos"
                          android:textColor="#7A889B"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tabSongs"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:gravity="center"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:text="Music"
                          android:textColor="#7A889B"
                          android:textSize="14sp" />
                  </LinearLayout>
              </HorizontalScrollView>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/tvSectionHeader"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Installed Packages"
                      android:textColor="#1C2536"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <CheckBox
                      android:id="@+id/cbSelectAll"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:buttonTint="#00D59B"
                      android:text="Select All"
                      android:textSize="12sp" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvItems"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:padding="8dp" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:background="#FFFFFF"
                  android:elevation="8dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/tvSelectedCount"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="0 SELECTED"
                      android:textColor="#7A889B"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNext"
                      android:layout_width="140dp"
                      android:layout_height="46dp"
                      android:backgroundTint="#00D59B"
                      android:text="NEXT"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          # 8. Item Layout
          cat << 'EOF' > app/src/main/res/layout/item_share.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="8dp">

              <RelativeLayout
                  android:layout_width="64dp"
                  android:layout_height="64dp">

                  <ImageView
                      android:id="@+id/ivIcon"
                      android:layout_width="54dp"
                      android:layout_height="54dp"
                      android:layout_centerInParent="true" />

                  <CheckBox
                      android:id="@+id/cbSelect"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:layout_alignParentBottom="true"
                      android:buttonTint="#00D59B"
                      android:clickable="false"
                      android:focusable="false" />
              </RelativeLayout>

              <TextView
                  android:id="@+id/tvName"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:maxLines="1"
                  android:textColor="#1C2536"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvSize"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:textColor="#7A889B"
                  android:textSize="10sp" />
          </LinearLayout>
          EOF

          # 9. Receive Screen Layout (QR Card, Wi-Fi Direct switch)
          cat << 'EOF' > app/src/main/res/layout/activity_receive.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0084FF"
              android:orientation="vertical">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:gravity="center_vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:id="@+id/btnBackReceive"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Back"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:layout_weight="1"
                      android:text="Waiting for sender..."
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnWifiDirectSwitch"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:backgroundTint="#2997FF"
                      android:text="Wi-Fi Direct"
                      android:textColor="#FFFFFF"
