name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (Installable) & AAB (Google Play Store)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Source & Build Web Bundle
        run: |
          if [ -f "package.json" ]; then
            echo "Building from repository source..."
            npm install --legacy-peer-deps
            npm run build
          else
            echo "Creating standalone web bundle..."
            mkdir -p dist
            cat << 'HTMLEOF' > dist/index.html
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>MI Share Turbo</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                body { background-color: #030712; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
              </style>
            </head>
            <body class="min-h-screen flex flex-col justify-between p-4 selection:bg-emerald-500">
              <header class="flex items-center justify-between py-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-400 to-teal-500 flex items-center justify-center font-black text-slate-950 text-sm">MI</div>
                  <span class="font-bold text-lg text-white">MI Share</span>
                </div>
                <div class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-500/30">100 MB/s P2P</div>
              </header>

              <main class="my-auto py-8 text-center">
                <div class="grid grid-cols-2 gap-6 max-w-xs mx-auto">
                  <button id="sendBtn" class="flex flex-col items-center group">
                    <div class="w-28 h-28 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-xl shadow-emerald-500/30 group-active:scale-95 transition-all text-white text-3xl font-black">
                      🚀
                    </div>
                    <span class="mt-3 font-bold text-lg text-white">Send</span>
                    <span class="text-xs text-slate-400">Share files & apps</span>
                  </button>

                  <button id="receiveBtn" class="flex flex-col items-center group">
                    <div class="w-28 h-28 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center shadow-xl shadow-sky-500/30 group-active:scale-95 transition-all text-white text-3xl font-black">
                      📥
                    </div>
                    <span class="mt-3 font-bold text-lg text-white">Receive</span>
                    <span class="text-xs text-slate-400">Join Hotspot / QR</span>
                  </button>
                </div>

                <div id="statusBox" class="mt-10 p-4 rounded-2xl bg-slate-900 border border-slate-800 max-w-sm mx-auto">
                  <p class="text-xs text-slate-400">MI Share High-Speed Offline Transfer Engine Active</p>
                  <p class="text-[11px] text-emerald-400 font-medium mt-1">Ready for 5GHz P2P Wi-Fi Direct Connection</p>
                </div>
                <input type="file" id="filePicker" multiple class="hidden" />
              </main>

              <footer class="text-center py-2 text-xs text-slate-500 border-t border-slate-800/80">
                MI Share Turbo • Fast & Secure File Sharing
              </footer>

              <script>
                const filePicker = document.getElementById('filePicker');
                const statusBox = document.getElementById('statusBox');
                document.getElementById('sendBtn').addEventListener('click', () => {
                  filePicker.click();
                });
                filePicker.addEventListener('change', (e) => {
                  if (e.target.files.length > 0) {
                    statusBox.innerHTML = '<p class="text-xs font-bold text-emerald-400">Selected ' + e.target.files.length + ' file(s)!</p><p class="text-[11px] text-slate-300 mt-1">Broadcasting P2P Radar...</p>';
                  }
                });
                document.getElementById('receiveBtn').addEventListener('click', () => {
                  statusBox.innerHTML = '<p class="text-xs font-bold text-sky-400">Waiting for sender...</p><p class="text-[11px] text-slate-300 mt-1">Hotspot and QR Code listener ready.</p>';
                });
              </script>
            </body>
            </html>
          HTMLEOF
          fi

      - name: Initialize Android Platform via Capacitor
        run: |
          mkdir -p .tmp_cap
          cd .tmp_cap
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cp -r ../dist ./dist
          npx cap init "MI Share" "com.mishare.filetransfer" --web-dir "dist"
          npx cap add android
          npx cap sync android
          mv android ../android
          cd ..
          rm -rf .tmp_cap

      - name: Inject AndroidManifest Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mishare.filetransfer">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.wifi.direct" android:required="false" />

              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="MI Share"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="MI Share"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate Release Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias mishare \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "mishare12345" \
            -keypass "mishare12345" \
            -dname "CN=MI Share, OU=Mobile, O=MIShareApp, L=NewDelhi, S=Delhi, C=IN"

      - name: Build Android Debug APK (Installable)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Android Release AAB (Play Store Bundle)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Sign Release AAB (Play Store Ready)
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass "mishare12345" \
            -keypass "mishare12345" \
            android/app/build/outputs/bundle/release/app-release.aab \
            mishare

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MI-Share-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MI-Share-PlayStore-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
